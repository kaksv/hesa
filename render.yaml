services:
  - type: web
    name: hesa-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ACCOUNT_ID
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DEMO_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
